<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><title>Random Classroom Choice | RandoSpino</title></head><body data-self-contained="true"><main class="tool-page"><div class="tool-header"><span class="kicker">RANDOMISE</span><h1>Random Classroom Choice</h1><p>Pick a classroom option fairly.</p></div><section class="tool-shell"><button id="run" class="action" type="button">Generate</button><div id="result" class="result"><strong>Ready when you are.</strong></div></section><p class="tool-note"><a href="/randospino/">← Back to RandoSpino</a></p></main><script>(function(){var a=['Pick a discussion leader','Choose the next presenter','Select a vocabulary word','Pick a team captain','Choose who goes first','Select a drawing prompt','Pick a review question','Choose a partner at random','Select a debate topic','Choose the next classroom helper','Pick the first speaker','Choose a group recorder','Select a question setter','Pick a note-taker','Choose a timekeeper','Select a warm-up activity','Pick a team name','Choose a reading order','Select a quiz category','Pick a peer reviewer','Choose a summariser','Pick a research topic','Select the next group to present','Choose a five-minute challenge','Pick a classroom game','Select the next question','Choose who reads first','Pick a discussion topic','Select a vocabulary challenge','Choose the next activity leader'];var b=document.getElementById('run'),o=document.getElementById('result');function r(){if(window.crypto&&crypto.getRandomValues){var x=new Uint32Array(1);crypto.getRandomValues(x);return a[x[0]%a.length]}return a[Math.floor(Math.random()*a.length)]}b.addEventListener('click',function(){o.innerHTML='<div class="result-main">'+r()+'</div>'})})();</script></body></html>
