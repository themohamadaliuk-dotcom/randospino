<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><title>Random Activity Generator | RandoSpino</title></head><body data-self-contained="true"><main class="tool-page"><div class="tool-header"><span class="kicker">RANDOMISE</span><h1>Random Activity Generator</h1><p>Get something fun and creative to do.</p></div><section class="tool-shell"><button id="run" class="action" type="button">Generate</button><div id="result" class="result"><strong>Ready when you are.</strong></div></section><p class="tool-note"><a href="../">← Back to RandoSpino</a></p></main><script>(function(){var a=['Draw something with your non-dominant hand','Build the tallest paper tower you can','Invent a three-word story with a friend','Make a 30-second advert for a random object','Create a new team logo','Find five things that share a colour','Write a haiku','Design a fictional country','Make up a new board game','Create a superhero with a silly weakness','Draw a map of an imaginary island','Invent a new holiday','Create a secret code','Write a six-line poem','Design an imaginary restaurant menu','Create a ten-second advert for water','Draw a creature using only circles','Invent a new sport','Write a fake newspaper headline','Create a fictional app idea','Make a paper sculpture','Design an imaginary theme park','Create a one-minute dance','Invent a new ice-cream flavour','Write a postcard from another planet','Build something from three household objects','Draw a city from the future','Make up a new school subject','Create a mystery for someone to solve','Invent a fictional festival','Photograph five interesting textures','Create a playlist for an imaginary film','Design a flag for a made-up nation','Write a short scene with no dialogue','Make a paper airplane and test three designs','Create a logo using three shapes','Invent a character and give them five unusual habits','Write a tiny recipe for an imaginary dish','Build a mini obstacle course','Create a two-minute scavenger hunt'];var b=document.getElementById('run'),o=document.getElementById('result');function r(){if(window.crypto&&crypto.getRandomValues){var x=new Uint32Array(1);crypto.getRandomValues(x);return a[x[0]%a.length]}return a[Math.floor(Math.random()*a.length)]}b.addEventListener('click',function(){o.innerHTML='<div class="result-main">'+r()+'</div>'})})();</script></body></html>
