<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><title>Random Historical Era Generator | RandoSpino</title></head><body data-self-contained="true"><main class="tool-page"><div class="tool-header"><span class="kicker">RANDOMISE</span><h1>Random Historical Era Generator</h1><p>Choose an era for a story, game or project.</p></div><section class="tool-shell"><button id="run" class="action" type="button">Generate</button><div id="result" class="result"><strong>Ready when you are.</strong></div></section><p class="tool-note"><a href="../">← Back to RandoSpino</a></p></main><script>(function(){var a=['Prehistoric Era','Ancient Egypt','Ancient Mesopotamia','Ancient Greece','Roman Republic','Roman Empire','Viking Age','Middle Ages','Islamic Golden Age','Mali Empire','Ming Dynasty','Renaissance','Age of Exploration','Elizabethan Era','Scientific Revolution','Georgian Era','Industrial Revolution','Victorian Era','Edwardian Era','Roaring Twenties','Great Depression Era','World War II Era','1950s','1960s','1970s','1980s','1990s','2000s','2010s','Digital Age','Near Future','Distant Future'];var b=document.getElementById('run'),o=document.getElementById('result');function r(){if(window.crypto&&crypto.getRandomValues){var x=new Uint32Array(1);crypto.getRandomValues(x);return a[x[0]%a.length]}return a[Math.floor(Math.random()*a.length)]}b.addEventListener('click',function(){o.innerHTML='<div class="result-main">'+r()+'</div>'})})();</script></body></html>
