name: RandoSpino QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in app.js data.js home-v3.js home-v4.js new-tools.js more-tools.js; do node --check "$f"; done

      - name: Check site structure
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f app.js
          test -f data.js
          test -f new-tools.js
          test -f more-tools.js
          test -f home-v3.js
          test -f home-v4.js
          test -f home-v3.css
          test -f style.css
          test -f robots.txt
          test -f sitemap.xml
          find . -mindepth 2 -maxdepth 2 -name index.html -print | sort

      - name: Check CSS, routes and tool wiring
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          for name in ('style.css','home-v3.css'):
              text = Path(name).read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'CSS brace balance failed: {name}')

          app = Path('app.js').read_text(encoding='utf-8')
          keys = set(re.findall(r'^\s{2}([A-Za-z0-9]+):\s*\{', app, flags=re.M))
          required = {'randomNumber','coinFlip','diceRoller','randomPicker','wheelSpinner','randomName','randomWord','randomCountry','randomColour','randomTeam','whoGoesFirst','yesOrNo','randomMovie','randomMeal','randomChallenge','randomGame','randomDate','usernameGenerator','gamerNameGenerator','teamNameGenerator','fantasyNameGenerator','petNameGenerator','partyGameGenerator','couplesDecisionMaker','secretSantaPicker'}
          missing = required - keys
          if missing:
              raise SystemExit(f'Missing expected core tool implementations: {sorted(missing)}')

          pages = list(Path('.').glob('*/index.html'))
          if not pages:
              raise SystemExit('No pages found')
          for page in pages:
              html = page.read_text(encoding='utf-8')
              if page.as_posix() == 'privacy/index.html':
                  continue
              match = re.search(r'data-tool="([A-Za-z0-9]+)"', html)
              if not match:
                  raise SystemExit(f'Missing data-tool in {page}')
              engine_ok = ('../app.js' in html or '../new-tools.js' in html or '../more-tools.js' in html)
              if not engine_ok:
                  raise SystemExit(f'Missing JS engine include in {page}')
              if '../new-tools.js' in html or '../more-tools.js' in html:
                  if not ('<h1' in html and 'id="result"' in html and 'id="run"' in html):
                      raise SystemExit(f'Incomplete lightweight tool page: {page}')

          print(f'Checked {len(pages)} pages and {len(keys)} core tool implementations.')
          PY
