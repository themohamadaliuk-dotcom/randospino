name: RandoSpino QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -e
          for f in app.js data.js new-tools.js new-tools-extra.js more-tools.js home-v5.js home-v6.js home-v6-finish.js analytics.js wheel-fix.js wheel-v2.js; do
            node --check "$f"
          done

      - name: Validate homepage tool routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          js = Path('home-v6.js').read_text(encoding='utf-8')
          urls = re.findall(r"\['[^']+',\'([^']+)/\'", js)
          missing = []
          for url in urls:
              p = Path(url.lstrip('./')) / 'index.html'
              if not p.exists():
                  missing.append(str(p))
          if missing:
              raise SystemExit('Homepage tools without pages: ' + ', '.join(missing))
          print(f'Validated {len(urls)} homepage tool routes.')
          PY

      - name: Validate sitemap routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          urls = re.findall(r'<loc>https://randospino\\.com(/[^<]*)</loc>', sitemap)
          missing = []
          for path in urls:
              clean = path.rstrip('/')
              target = Path('index.html') if clean == '' else Path(clean.lstrip('/')) / 'index.html'
              if not target.exists():
                  missing.append(str(target))
          if missing:
              raise SystemExit('Sitemap routes without pages: ' + ', '.join(missing))
          print(f'Validated {len(urls)} sitemap routes.')
          PY

      - name: Validate page wiring and CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          seo_pages = {
              'random-picker-for-classroom/index.html','random-team-generator-for-work/index.html',
              'random-picker-for-parties/index.html','random-wheel-for-students/index.html',
              'random-game-generator/index.html','random-name-generators/index.html',
              'random-team-generators/index.html','random-food-generators/index.html',
              'random-decision-tools/index.html','random-party-games/index.html','random-wheel-spinner/index.html'
          }
          self_contained = {
              'random-planet/index.html','random-element/index.html','random-era/index.html',
              'random-activity/index.html','random-classroom-choice/index.html','random-food-ingredient/index.html'
          }
          for css in ('style.css','home-v3.css','home-v6-finish.css','wheel-v2.css'):
              t = Path(css).read_text(encoding='utf-8')
              if t.count('{') != t.count('}'):
                  raise SystemExit(f'CSS brace mismatch: {css}')
          homepage = Path('index.html').read_text(encoding='utf-8')
          for required in ('analytics.js','home-v6.js','home-v6-finish.js','home-v6-finish.css'):
              if required not in homepage:
                  raise SystemExit(f'Homepage missing 2.0 asset: {required}')
          pages = list(Path('.').glob('*/index.html'))
          for page in pages:
              p = page.as_posix()
              if p == 'privacy/index.html' or p in seo_pages:
                  continue
              html = page.read_text(encoding='utf-8')
              if p in self_contained:
                  if '<script>' not in html or 'addEventListener' not in html:
                      raise SystemExit(f'Self-contained page missing inline generator: {page}')
                  continue
              if 'data-tool=' not in html:
                  raise SystemExit(f'Missing data-tool: {page}')
              if not any(x in html for x in ('../app.js','../new-tools.js','../new-tools-extra.js','../more-tools.js')):
                  raise SystemExit(f'Missing engine script: {page}')
          print(f'Validated {len(pages)} page documents.')
          PY

      - name: Validate self-contained generators
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          required = [
              'random-planet/index.html','random-element/index.html','random-era/index.html',
              'random-activity/index.html','random-classroom-choice/index.html','random-food-ingredient/index.html'
          ]
          for filename in required:
              text = Path(filename).read_text(encoding='utf-8')
              if '<script>' not in text or 'addEventListener' not in text:
                  raise SystemExit(f'Missing inline Generate handler: {filename}')
              if 'crypto.getRandomValues' not in text:
                  raise SystemExit(f'Missing secure randomness: {filename}')
          print('Validated self-contained generator pages.')
          PY
