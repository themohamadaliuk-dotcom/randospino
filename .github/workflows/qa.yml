name: RandoSpino QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in app.js data.js home-v3.js home-v4.js new-tools.js more-tools.js; do
            node --check "$f"
          done

      - name: Check site structure and sitemap
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f app.js
          test -f data.js
          test -f new-tools.js
          test -f more-tools.js
          test -f home-v3.js
          test -f home-v4.js
          test -f home-v3.css
          test -f style.css
          test -f robots.txt
          test -f sitemap.xml

          python - <<'PY'
          from pathlib import Path
          import re

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          urls = re.findall(r'<loc>https://randospino\.com(/[^<]*)</loc>', sitemap)
          if not urls:
              raise SystemExit('Sitemap contains no randospino.com URLs')

          missing = []
          for path in urls:
              clean = path.rstrip('/')
              target = Path('index.html') if clean == '' else Path(clean.lstrip('/')) / 'index.html'
              if not target.exists():
                  missing.append(str(target))
          if missing:
              raise SystemExit('Sitemap routes without matching pages: ' + ', '.join(missing))

          print(f'Validated {len(urls)} sitemap URLs against the repository.')
          PY

      - name: Check CSS, routes and tool wiring
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          for name in ('style.css','home-v3.css'):
              text = Path(name).read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'CSS brace balance failed: {name}')

          app = Path('app.js').read_text(encoding='utf-8')
          keys = set(re.findall(r'^\s{2}([A-Za-z0-9]+):\s*\{', app, flags=re.M))
          required = {'randomNumber','coinFlip','diceRoller','randomPicker','wheelSpinner','randomName','randomWord','randomCountry','randomColour','randomTeam','whoGoesFirst','yesOrNo','randomMovie','randomMeal','randomChallenge','randomGame','randomDate','usernameGenerator','gamerNameGenerator','teamNameGenerator','fantasyNameGenerator','petNameGenerator','partyGameGenerator','couplesDecisionMaker','secretSantaPicker'}
          missing = required - keys
          if missing:
              raise SystemExit(f'Missing expected core tool implementations: {sorted(missing)}')

          lightweight_engines = {
              'new-tools.js': Path('new-tools.js').read_text(encoding='utf-8'),
              'more-tools.js': Path('more-tools.js').read_text(encoding='utf-8'),
          }
          for engine, text in lightweight_engines.items():
              if 'crypto.getRandomValues' not in text:
                  raise SystemExit(f'{engine} is missing secure randomness')
              if 'pickFresh' not in text:
                  raise SystemExit(f'{engine} is missing recent-result variety logic')

          pages = list(Path('.').glob('*/index.html'))
          if not pages:
              raise SystemExit('No pages found')

          lightweight_keys = set()
          for text in lightweight_engines.values():
              lightweight_keys.update(re.findall(r'(random[A-Za-z0-9]+):\[', text))

          for page in pages:
              html = page.read_text(encoding='utf-8')
              if page.as_posix() == 'privacy/index.html':
                  continue
              match = re.search(r'data-tool="([A-Za-z0-9]+)"', html)
              if not match:
                  raise SystemExit(f'Missing data-tool in {page}')
              key = match.group(1)
              engine_ok = ('../app.js' in html or '../new-tools.js' in html or '../more-tools.js' in html)
              if not engine_ok:
                  raise SystemExit(f'Missing JS engine include in {page}')
              if '../new-tools.js' in html or '../more-tools.js' in html:
                  if key not in lightweight_keys:
                      raise SystemExit(f'No lightweight tool mapping for {key} in {page}')
                  for required_marker in ('id="tool-title"','id="tool-desc"','id="run"','id="result"'):
                      if required_marker not in html:
                          raise SystemExit(f'Missing {required_marker} in {page}')

          print(f'Checked {len(pages)} pages and {len(keys)} core tool implementations.')
          PY

      - name: Check generator data has useful breadth
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          for filename in ('new-tools.js','more-tools.js'):
              text = Path(filename).read_text(encoding='utf-8')
              lists = re.findall(r'([A-Za-z]+):\[(.*?)\]', text)
              small = []
              for name, body in lists:
                  count = len(re.findall(r"'(?:[^'\\]|\\.)*'", body))
                  if count < 5 and name not in {'months','days','seasons','continents','zodiac','birthstones','planets'}:
                      small.append((name, count))
              if small:
                  raise SystemExit(f'{filename} contains suspiciously small generator pools: {small}')
          print('Generator pool breadth checks passed.')
          PY
