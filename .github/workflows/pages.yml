name: Deploy RandoSpino to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Normalize project-site navigation and wheel assets
        run: |
          python - <<'PY'
          from pathlib import Path
          for page in Path('.').glob('*/index.html'):
              text = page.read_text(encoding='utf-8')
              text = text.replace('href="/#', 'href="../#')
              text = text.replace('href="/"', 'href="../"')
              if page.as_posix() == 'wheel-spinner/index.html':
                  text = text.replace('../wheel-v2.css"', '../wheel-v2.css?v=4"')
              page.write_text(text, encoding='utf-8')
          print('Normalized nested-page navigation and cache-busted the wheel stylesheet.')
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
