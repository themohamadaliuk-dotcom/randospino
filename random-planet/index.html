<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><title>Random Planet Generator | RandoSpino</title></head><body><main class="tool-page"><div class="tool-header"><span class="kicker">RANDOMISE</span><h1>Random Planet Generator</h1><p>Pick a planet at random.</p></div><section class="tool-shell"><button id="run" class="action" type="button">Generate</button><div id="result" class="result"><strong>Ready when you are.</strong></div></section><p class="tool-note"><a href="../">← Back to RandoSpino</a></p></main><script>(function(){var a=['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune'];var b=document.getElementById('run'),o=document.getElementById('result');function r(){if(window.crypto&&crypto.getRandomValues){var x=new Uint32Array(1);crypto.getRandomValues(x);return a[x[0]%a.length]}return a[Math.floor(Math.random()*a.length)]}b.addEventListener('click',function(){o.innerHTML='<div class="result-main">'+r()+'</div>'})})();</script></body></html>
