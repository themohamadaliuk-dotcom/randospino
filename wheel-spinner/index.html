<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://themohamadaliuk-dotcom.github.io/randospino/wheel-spinner/">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../wheel-v2.css?v=6">
<title>Wheel Spinner | RandoSpino</title>
<style>
  .wheel-page-shell{max-width:920px;margin:auto;padding:62px 20px 90px}
  .wheel-card{background:rgba(255,255,255,.97);border:1px solid #e7e7ef;border-radius:28px;padding:24px;box-shadow:0 25px 70px rgba(24,28,55,.08)}
  .wheel-entry-label{display:grid;gap:8px;color:#2b2e40;font-size:13px;font-weight:800}
  .wheel-entry-label textarea{width:100%;min-height:120px;padding:13px 14px;border:1px solid #dfe0e9;border-radius:13px;background:#fff;color:#22253a;outline:none;resize:vertical}
  .wheel-entry-label textarea:focus{border-color:#725cf0;box-shadow:0 0 0 4px rgba(114,92,240,.12)}
  .wheel-options{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .wheel-options button,.wheel-options label{border:1px solid #ddd8f5;background:#fff;color:#5b4bc8;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer}
  .wheel-options label{display:inline-flex;align-items:center;gap:7px;color:#575a6e;background:#faf9ff;cursor:pointer}
  .wheel-options input{accent-color:#6b57f1}
  .wheel-stage{position:relative;display:grid;place-items:center;margin:18px 0 0;padding:0;background:transparent;border:0;box-shadow:none}
  #wheelCanvas{display:block;width:min(100%,520px);height:auto;aspect-ratio:1/1;border-radius:50%;background:transparent;filter:drop-shadow(0 18px 26px rgba(54,45,120,.18))}
  .wheel-pointer{position:absolute;z-index:5;top:-2px;left:50%;width:0;height:0;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:27px solid #171827;filter:drop-shadow(0 4px 7px rgba(23,24,39,.18))}
  .wheel-pointer:after{content:"";position:absolute;left:-10px;top:1px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:17px solid #fff}
  #spinWheel{width:100%;margin-top:8px}
  .wheel-result{margin-top:14px;padding:22px;border-radius:20px;background:linear-gradient(135deg,#f6f2ff,#fff0f5,#edfffb);text-align:center;min-height:120px;display:grid;place-items:center;gap:12px}
  .wheel-result-main{font-size:clamp(28px,6vw,46px);font-weight:900;letter-spacing:-1.5px;color:#26243e}
  .wheel-result-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .wheel-result-actions button{border:1px solid #ddd8f5;background:#fff;color:#5b4bc8;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer}
  .wheel-note{text-align:center;color:#858898;font-size:12px;margin:10px 0 0}
  @media(max-width:760px){.wheel-page-shell{padding:44px 16px 70px}.wheel-card{padding:18px;border-radius:22px}.wheel-stage{margin-top:14px}#spinWheel{margin-top:6px}}
</style>
</head>
<body>
<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="/randospino/"><span class="brand-mark">R</span>RandoSpino</a>
    <nav>
      <a href="/randospino/">Home</a>
      <a href="/randospino/#random">Random</a>
      <a href="/randospino/#decide">Decide</a>
      <a href="/randospino/#generate">Generate</a>
    </nav>
  </div>
</header>
<main class="wheel-page-shell">
  <div class="breadcrumbs"><a href="/randospino/">RandoSpino</a> / Wheel Spinner</div>
  <div class="tool-header">
    <span class="kicker">DECISION TOOL</span>
    <h1>Wheel Spinner</h1>
    <p>Enter your choices, spin the wheel, and let RandoSpino decide.</p>
  </div>
  <section class="wheel-card">
    <label class="wheel-entry-label" for="wheelItems">Your choices
      <textarea id="wheelItems" spellcheck="false">Pizza
Burgers
Indian
Chinese
Mexican
Pasta
Sushi</textarea>
    </label>
    <div class="wheel-options">
      <button type="button" data-preset="Dinner">🍕 Dinner</button>
      <button type="button" data-preset="Party">🎉 Party</button>
      <button type="button" data-preset="Classroom">📚 Classroom</button>
      <button type="button" data-preset="Games">🎮 Games</button>
      <label><input id="wheelSound" type="checkbox" checked> Sound</label>
      <label><input id="removeWinner" type="checkbox"> Remove winner</label>
    </div>
    <div class="wheel-stage">
      <div class="wheel-pointer" aria-hidden="true"></div>
      <canvas id="wheelCanvas" aria-label="Random choice wheel"></canvas>
    </div>
    <button id="spinWheel" class="action" type="button">🎡 Spin the wheel</button>
    <div id="wheelResult" class="wheel-result"><strong>Ready when you are.</strong></div>
    <p class="wheel-note">Add at least two choices to spin.</p>
  </section>
</main>
<footer>
  <div class="footer-wrap">
    <div>
      <a class="brand footer-brand" href="/randospino/"><span class="brand-mark">R</span>RandoSpino</a>
      <p>Randomise it. Pick it. Decide it.</p>
    </div>
  </div>
  <div class="footer-bottom">© 2026 RandoSpino. Built for fun.</div>
</footer>
<script>
(function(){
  'use strict';
  var canvas=document.getElementById('wheelCanvas');
  var input=document.getElementById('wheelItems');
  var spin=document.getElementById('spinWheel');
  var result=document.getElementById('wheelResult');
  var sound=document.getElementById('wheelSound');
  var removeWinner=document.getElementById('removeWinner');
  var rotation=0,spinning=false;
  var colours=['#6b57f1','#ff5f98','#14b8a6','#f59e0b','#06b6d4','#8b5cf6','#ef4444','#22c55e','#3b82f6','#ec4899','#84cc16','#f97316'];
  var presets={
    Dinner:['Pizza','Burgers','Indian','Chinese','Mexican','Pasta','Sushi'],
    Party:['Charades','Truth or Dare','Would You Rather','Pictionary','Trivia','Music Quiz','Two Truths and a Lie'],
    Classroom:['Discussion leader','Next presenter','Team captain','Timekeeper','Recorder','First speaker','Warm-up activity'],
    Games:['Minecraft','Mario Kart','Fortnite','Uno','Chess','Monopoly','Among Us','Rocket League']
  };
  function random32(){var a=new Uint32Array(1);window.crypto.getRandomValues(a);return a[0];}
  function randomInt(min,max){var span=max-min+1,limit=Math.floor(4294967296/span)*span,v;do{v=random32();}while(v>=limit);return min+(v%span);}
  function values(){return input.value.split(/[\n,]+/).map(function(x){return x.trim();}).filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;});}
  function resize(){var rect=canvas.getBoundingClientRect(),size=Math.max(280,Math.min(520,Math.round(rect.width||520))),dpr=window.devicePixelRatio||1;canvas.width=size*dpr;canvas.height=size*dpr;canvas.style.width=size+'px';canvas.style.height=size+'px';draw();}
  function draw(){var items=values();if(!items.length)items=['Add entries'];var dpr=window.devicePixelRatio||1,size=canvas.width/dpr||520,ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,size,size);var cx=size/2,cy=size/2,r=size/2-10,s=2*Math.PI/items.length;ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation*Math.PI/180);items.forEach(function(item,i){var start=-Math.PI/2+i*s,end=start+s;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,end);ctx.closePath();ctx.fillStyle=colours[i%colours.length];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.94)';ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.rotate(start+s/2);ctx.fillStyle='#fff';ctx.font=(items.length>12?'12px':'15px')+' Inter,Arial,sans-serif';ctx.fontWeight='800';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(item.length>20?item.slice(0,19)+'…':item,r-18,0);ctx.restore();});ctx.beginPath();ctx.arc(0,0,40,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='rgba(25,27,45,.12)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#171827';ctx.font='800 13px Inter,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('RANDO',0,-5);ctx.fillText('SPINO',0,11);ctx.restore();}
  function beep(){if(!sound.checked)return;try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var ac=new A(),o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=620;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.07,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.16);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.17);}catch(e){}}
  function showResult(winner){result.innerHTML='<div class="wheel-result-main">🎡 '+escapeHtml(winner)+'</div><div class="wheel-result-actions"><button type="button" id="copyWheel">Copy result</button><button type="button" id="shareWheel">Share result</button></div>';document.getElementById('copyWheel').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(winner).then(function(){this.textContent='Copied ✓';}.bind(this));};document.getElementById('shareWheel').onclick=function(){var text='RandoSpino chose: '+winner;if(navigator.share)navigator.share({title:'RandoSpino result',text:text,url:location.href}).catch(function(){});else navigator.clipboard&&navigator.clipboard.writeText(text);};}
  function escapeHtml(v){return String(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  input.addEventListener('input',draw);
  window.addEventListener('resize',resize);
  document.querySelectorAll('[data-preset]').forEach(function(btn){btn.addEventListener('click',function(){input.value=presets[btn.dataset.preset].join('\n');draw();});});
  spin.addEventListener('click',function(){if(spinning)return;var items=values();if(items.length<2){result.innerHTML='<strong>Add at least two choices to spin.</strong>';return;}spinning=true;spin.disabled=true;var winner=randomInt(0,items.length-1),slice=360/items.length,center=winner*slice+slice/2;var delta=((360-center-(rotation%360))+360)%360+360*5+randomInt(0,2)*360;var target=rotation+delta;canvas.style.transition='transform 1.8s cubic-bezier(.12,.74,.22,1)';canvas.style.transform='rotate('+target+'deg)';beep();setTimeout(function(){rotation=target%360;canvas.style.transition='none';canvas.style.transform='rotate('+rotation+'deg)';showResult(items[winner]);if(removeWinner.checked){items.splice(winner,1);input.value=items.join('\n');}spinning=false;spin.disabled=false;},1850);});
  resize();
})();
</script>
</body>
</html>
